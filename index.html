<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0b1a">
  <title>SAIDIO — 創作素材營運台</title>
  <meta name="description" content="SAIDIO 每日 prompt 工廠與統一素材庫。五條產線的今日任務、歷史歸檔與製作策略。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span>
    <span class="blob b3"></span><span class="blob b4"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar glass">
    <div class="brand">
      <span class="mark" aria-hidden="true">S</span>
      <div class="brand-text">
        <strong>SAIDIO</strong>
        <span class="brand-sub">創作素材營運台</span>
      </div>
    </div>
    <nav class="tabs" aria-label="主要章節">
      <button class="tab active" data-view="today">今天</button>
      <button class="tab" data-view="lines">產線</button>
      <button class="tab" data-view="archive">歸檔</button>
      <button class="tab" data-view="strategy">策略</button>
    </nav>
    <div class="topbar-meta">
      <span class="dot" aria-hidden="true"></span>
      <span id="updated-at">載入中…</span>
    </div>
  </header>

  <main>
    <!-- 今天:唯一的「我今天要生什麼」清單 -->
    <section class="view active" id="view-today">
      <div class="hero glass">
        <div class="hero-copy">
          <p class="eyebrow">今日任務</p>
          <h1 id="today-date">—</h1>
          <p class="muted" id="today-summary">正在載入今天的素材簡報…</p>
        </div>
        <div class="hero-stats" id="today-stats"></div>
      </div>
      <div class="chip-row" id="today-filter" aria-label="產線過濾"></div>
      <div id="today-groups" class="stack"></div>
    </section>

    <!-- 產線:每條線的規則與歷史 -->
    <section class="view" id="view-lines">
      <div class="section-head">
        <div><p class="eyebrow">五條產線</p><h2>每條線的規則與產出歷史</h2></div>
        <button id="lines-back" class="mini glass" hidden>← 全部產線</button>
      </div>
      <div class="line-grid" id="line-grid"></div>
      <div id="line-detail" class="stack" hidden></div>
    </section>

    <!-- 歸檔:年曆 → 那天生了什麼 -->
    <section class="view" id="view-archive">
      <div class="section-head">
        <div><p class="eyebrow">素材歸檔</p><h2>依日期查找</h2></div>
        <div class="month-nav glass">
          <button id="prev-month" aria-label="上個月">←</button>
          <strong id="month-label"></strong>
          <button id="next-month" aria-label="下個月">→</button>
        </div>
      </div>
      <div class="archive-layout">
        <div class="glass panel calendar-card">
          <div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
          <div id="calendar-grid" class="calendar-grid"></div>
          <div class="legend" id="calendar-legend"></div>
        </div>
        <div class="glass panel" id="archive-detail">
          <div class="empty">在左側年曆選一天,查看當天所有產線的 Prompt。</div>
        </div>
      </div>
    </section>

    <!-- 策略:專案 + 訊號 + 指標 -->
    <section class="view" id="view-strategy">
      <div class="section-head">
        <div><p class="eyebrow">製作策略</p><h2>專案進度與每日訊號</h2></div>
      </div>
      <div class="metric-row" id="metrics"></div>
      <div class="strategy-layout">
        <div class="glass panel">
          <p class="eyebrow">進行中的專案</p>
          <div id="projects-grid" class="projects-grid"></div>
        </div>
        <div class="glass panel">
          <p class="eyebrow">SEANRADAR / 訊號</p>
          <div id="radar-list" class="radar-list"></div>
          <blockquote>精進創作,<br>不被工具定義。</blockquote>
          <p class="muted small">每個訊號都要先變成製作問題,而不是自動變成影片。</p>
        </div>
      </div>
    </section>
  </main>

  <footer>SAIDIO / SUNIVERSE 創作層 · <span id="footer-updated"></span></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
